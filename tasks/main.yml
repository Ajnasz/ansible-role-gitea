---

- name: "Include armv7 vars"
  include_vars:
    file: "armv7.yml"
  when: ansible_facts["architecture"] == "armv7l"

- name: "Include arm64 vars"
  include_vars:
    file: "aarch64.yml"
  when: ansible_facts["architecture"] == "aarch64"

- name: "Include amd64 vars"
  include_vars:
    file: "amd64.yml"
  when: ansible_facts["architecture"] == "x86_64"

- name: "Install git"
  ansible.builtin.apt:
    name: git

- name: "Gitea: Create {{ gitea_user }} user"
  user:
    name: "{{ gitea_user }}"
    shell: "/bin/bash"

- name: "Gitea: Create gitea custom directory"
  file:
    path: "/home/{{ gitea_user }}/custom"
    state: "directory"
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"

- name: "Gitea: Download Gitea"
  get_url:
    url: "{{ gitea_download_url }}"
    checksum: "{{ gitea_checksum_url }}"
    dest: "/home/{{ gitea_user }}/gitea"
    mode: "0755"
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"
  notify:
    - "restart gitea"

- name: "Gitea: Add service file"
  copy:
    src: "gitea.service"
    dest: "/etc/systemd/system/gitea.service"
  notify:
    - "enable gitea"

- name: "Gitea: Create gitea config directory"
  file:
    path: "/home/{{ gitea_user }}/custom/conf"
    state: "directory"
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"

- name: "Gitea: warn about deprecated gitea_webhook_allowed_host_list"
  ansible.builtin.debug:
    msg: >-
      WARNING: gitea_webhook_allowed_host_list is deprecated - gitea moved
      ALLOWED_HOST_LIST from [webhook] to [security] and drops the [webhook]
      fallback in v28.0.0. Its value is being merged into
      [security].ALLOWED_HOST_LIST for you; set gitea_security_allowed_host_list
      instead to silence this warning.
  when:
    - gitea_webhook_allowed_host_list | length > 0
    - gitea_security_allowed_host_list is none

- name: "Create gitea config"
  template:
    src: "app.ini.j2"
    dest: "/home/{{ gitea_user }}/custom/conf/app.ini"
    owner: "{{ gitea_user }}"
    group: "{{ gitea_group }}"
  notify:
    - "reload systemd"
    - "restart gitea"

- include_tasks: backup.yml
  when: gitea_do_backup

